<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Order summary card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="./images/illustration-hero.svg" alt="A girl">
    <div>
    <h1>Order Summary</h1>
    <div class="content">
      <p class="info">
        You can now listen to milions of songs, audiobooks,
        and podcast on any device you like!
      </p>
    </div>
    <div class="details">
      <img src="./images/icon-music.svg" alt="Music icon" class="music">
      <div class="plan">
        <h4>Annual plan</h4>
        <p>$59.99/year</p>
      </div>
      <div>
        <a href="#" class="link">Change</a>
      </div>
    </div>
    <div class="payment">
      <p>Proceed to Payment</p>
    </div>
    <div class="cancel">
      <p>Cancel Order</p>
    </div>
  </div>

</body>
</html>
